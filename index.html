<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Video System</title>
    <style>
        body { background-color: #000; color: white; text-align: center; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .stats { padding: 15px; font-size: 22px; background: #1a1a1a; border-bottom: 3px solid #ed1c24; font-weight: bold; }
        .video-wrapper { position: relative; padding-bottom: 177.77%; height: 0; overflow: hidden; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #balance { color: #00ff00; }
    </style>
</head>
<body>

    <div class="stats">Kredi: <span id="balance">0.00</span> Goud</div>

    <div class="video-wrapper">
        <div id="player"></div>
    </div>

    <script>
        // Lojik pou jere santim ak goud
        let totalSantim = 0;
        let currentVideoIndex = 0;

        // Lis 10 videyo YouTube (Ou ka ajoute plis toujou la a)
        const videoList = [
            'RoAtML-fDSI', // Videyo 1
            'vtxrwhcRCZI', // Videyo 2
            'm5W_vXv3i90', // Videyo 3
            '3HhV_m6S9vA', // Videyo 4
            'W2X_5_lG_G8', // Videyo 5
            '9bX7Y1V6Yp0', // Videyo 6
            'L_X5G2v1YwQ', // Videyo 7
            'K_R9v2X3YmP', // Videyo 8
            'J_S1v4X5YnL', // Videyo 9
            'H_T2v6X7YkM'  // Videyo 10
        ];

        // Chaje API YouTube la
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoList[currentVideoIndex],
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // Lè yon videyo fini
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                ajouteKredi();
                jwePwochenVideo();
            }
        }

        function ajouteKredi() {
            // Nou ajoute 1 santim (0.01)
            totalSantim += 1; 
            
            // Konvèti 100 santim an 1 goud otomatikman
            let montanFinal = (totalSantim / 100).toFixed(2);
            
            // Mizajou nan HTML la
            document.getElementById("balance").innerText = montanFinal;

            // VOYE NAN SKETCHWARE (Frape edittextGenyen ak edittextPeye)
            if (window.SketchwareInterface) {
                SketchwareInterface.voyeKòb(montanFinal);
            }
        }

        function jwePwochenVideo() {
            currentVideoIndex++;
            // Si gen videyo toujou nan lis la, nou jwe pwochen an
            if (currentVideoIndex < videoList.length) {
                player.loadVideoById(videoList[currentVideoIndex]);
            } else {
                // Si tout fini, nou tounen nan premye videyo a
                currentVideoIndex = 0;
                player.loadVideoById(videoList[currentVideoIndex]);
            }
        }
    </script>
</body>
</html>
