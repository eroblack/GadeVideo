<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #000; color: white; text-align: center; margin: 0; padding: 0; }
        .video-wrapper { position: relative; padding-bottom: 177.77%; height: 0; overflow: hidden; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .stats { padding: 15px; font-size: 20px; background: #222; border-bottom: 2px solid red; }
    </style>
</head>
<body>

    <div class="stats">Goud Ganyen: <span id="balance">0.00</span></div>

    <div class="video-wrapper">
        <iframe id="myVideo" 
            src="https://www.youtube.com/embed/RoAtML-fDSI?enablejsapi=1&rel=0" 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>

    <script>
        let totalSantim = 0;

        // Sa se lojik pou n konnen lè videyo a fini
        // Nou itilize API YouTube la
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('myVideo', {
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // Lè videyo a fini (State 0 vle di 'ENDED')
            if (event.data == YT.PlayerState.ENDED) {
                ajouteLajan();
            }
        }

        function ajouteLajan() {
            // Nou ajoute 50 santim chak fwa videyo a fini
            totalSantim += 50; 
            
            // Konvèti an goud: 100 santim = 1.00 goud otomatikman
            let totalGoud = (totalSantim / 100).toFixed(2);
            
            // Mizajou sou ekran an
            document.getElementById("balance").innerText = totalGoud;

            // VOYE REZILTA A NAN SKETCHWARE
            if (window.SketchwareInterface) {
                // Sa ap frape edittextGenyen ou an dirèkteman
                SketchwareInterface.voyeKòb(totalGoud);
            }
        }
    </script>
</body>
</html>
