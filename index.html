<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Video Lajan</title>
    <style>
        /* Stil jeneral Gaming Cyberpunk */
        body { 
            background: radial-gradient(circle, #021128, #000511); 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- Seksyon HUD (Heads-Up Display) --- */

        /* Nivo Lajan / Kredi (Kwen Anwo Gòch) */
        .game-stats {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid #00ff00;
            padding: 8px 15px;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            font-size: 16px;
            font-weight: bold;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .game-stats span {
            display: block;
            font-size: 22px;
            text-shadow: 0 0 10px #00ff00;
        }

        /* Ti Ba Enfòmasyon ki monte yon ti kras epi ki pi piti */
        .game-ticker {
            position: absolute;
            bottom: 12px; /* Li monte yon ti kras anlè rebò a */
            left: 5%;
            width: 90%; /* Li pa pran tout ekran an nèt pou l ka parèt pi bèl */
            background: rgba(2, 22, 53, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 20px; /* Li yon ti kras kobe nan kwen yo */
            padding: 4px 0; /* Li pi fin foun nèt */
            z-index: 100;
            font-size: 11px; /* Tèks la vin pi piti ak pi dous */
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 18s linear infinite; /* Vitès la vin pi dous toujou */
        }

        /* --- Seksyon Videyo --- */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Bouton Replay Game Style */
        #replayBtn {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            background: linear-gradient(45deg, #ff0055, #990033);
            color: white;
            border: 2px solid #ffffff;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            z-index: 105;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        #replayBtn:hover {
            background: linear-gradient(45deg, #00ff00, #008800);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        /* Animasyon pou ticker la */
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- HUD Netwaye (Kredi sèlman ki rete anlè) -->
    <div class="game-stats">
        KREDI / WALLET
        <span id="balance">0.00</span> HTG
    </div>

    <!-- Ti ba enstriksyon ki pi bèl la -->
    <div class="game-ticker">
        <div class="ticker-text">• Gade videyo a nèt pou w ka genyen kach! • REPLAY ap ba w plis avantaj • Jwèt la kòmanse! •</div>
    </div>

    <!-- Videyo an background -->
    <div class="video-wrapper">
        <div id="player"></div>
    </div>
    
    <button id="replayBtn" onclick="replayVideo()">NEXT ROUND (Fè 1 santim ankò)</button>

    <script>
        let totalGoud = 0;
        const videoID = 'RoAtML-fDSI'; 

        function sendToApp(bwat, val) {
            if (window.Android) { window.Android.voyeKòb(bwat, val.toString()); }
            if (window.SketchwareInterface) { window.SketchwareInterface.voyeKòb(bwat + ":" + val); }
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%', videoId: videoID,
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                totalGoud += 0.01; 
                let reziltaDisplay = totalGoud.toFixed(2);
                document.getElementById("balance").innerText = reziltaDisplay;
                document.getElementById('replayBtn').style.display = 'block';

                if (totalGoud >= 1.00) {
                    sendToApp("genyen", "1");
                }
            }
        }

        function replayVideo() {
            player.playVideo();
            document.getElementById('replayBtn').style.display = 'none';
        }
    </script>
</body>
</html>
