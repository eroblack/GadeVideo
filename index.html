<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Video Lajan</title>
    <style>
        /* Stil jeneral Gaming Cyberpunk */
        body { 
            background: radial-gradient(circle, #021128, #000511); 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- Seksyon HUD (Heads-Up Display) Jwèt la --- */
        
        /* Tit Jwèt la nan mitan anlè */
        .game-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #0088ff;
            animation: pulse 2s infinite alternate;
        }

        /* Nivo Lajan / Kredi (Kwen Anwo Gòch) */
        .game-stats {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid #00ff00;
            padding: 8px 15px;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            font-size: 16px;
            font-weight: bold;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .game-stats span {
            display: block;
            font-size: 22px;
            text-shadow: 0 0 10px #00ff00;
        }

        /* Info Piblisite / Kontak (Kwen Anwo Dwat) */
        .game-promo {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            border-right: 4px solid #ff00ff;
            padding: 8px 15px;
            border-radius: 8px 0 0 8px;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
            font-size: 11px;
            text-align: right;
            max-width: 200px;
        }
        .game-promo text {
            color: #ff00ff;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }
        .contact {
            color: #ffffff;
            display: block;
            font-family: monospace;
        }

        /* Ba Enfòmasyon Anba k'ap defile (Ticker Tele) */
        .game-ticker {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(2, 22, 53, 0.8);
            border-top: 2px solid #00ffff;
            padding: 5px 0;
            z-index: 100;
            font-size: 14px;
            color: #b3d9ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 15s linear infinite;
        }

        /* --- Seksyon Videyo --- */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Bouton Replay Game Style */
        #replayBtn {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            background: linear-gradient(45deg, #ff0055, #990033);
            color: white;
            border: 2px solid #ffffff;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            z-index: 105;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        #replayBtn:hover {
            background: linear-gradient(45deg, #00ff00, #008800);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        /* Animasyon yo */
        @keyframes pulse {
            from { text-shadow: 0 0 10px #00ffff, 0 0 20px #0088ff; }
            to { text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffcc, 0 0 40px #0088ff; }
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- HUD / Ekran Jwèt la -->
    <h1 class="game-title">EROBLACK</h1>

    <div class="game-stats">
        KREDI / WALLET
        <span id="balance">0.00</span> HTG
    </div>

    <div class="game-promo">
        <text>ADS / PIBLISITE:</text>
        <span class="contact">eroblack24@gmail.com</span>
        <span class="contact">4066-8847</span>
    </div>

    <div class="game-ticker">
        <div class="ticker-text">• Gade videyo a nèt pou w ka genyen kach! • REPLAY ap ba w plis avantaj • EROBLACK jwèt la kòmanse! •</div>
    </div>

    <!-- Videyo an background -->
    <div class="video-wrapper">
        <div id="player"></div>
    </div>
    
    <button id="replayBtn" onclick="replayVideo()">NEXT ROUND (Fè 1 santim ankò)</button>

    <script>
        let totalGoud = 0;
        const videoID = 'RoAtML-fDSI'; 

        function sendToApp(bwat, val) {
            if (window.Android) { window.Android.voyeKòb(bwat, val.toString()); }
            if (window.SketchwareInterface) { window.SketchwareInterface.voyeKòb(bwat + ":" + val); }
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%', videoId: videoID,
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                totalGoud += 0.01; 
                let reziltaDisplay = totalGoud.toFixed(2);
                document.getElementById("balance").innerText = reziltaDisplay;
                document.getElementById('replayBtn').style.display = 'block';

                if (totalGoud >= 1.00) {
                    sendToApp("genyen", "1");
                }
            }
        }

        function replayVideo() {
            player.playVideo();
            document.getElementById('replayBtn').style.display = 'none';
        }
    </script>
</body>
</html>
