<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Test System</title>
    <style>
        body { background-color: #000; color: white; text-align: center; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .stats { padding: 15px; font-size: 22px; background: #1a1a1a; border-bottom: 3px solid #ed1c24; font-weight: bold; }
        .video-wrapper { position: relative; padding-bottom: 177.77%; height: 0; overflow: hidden; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #balance { color: #00ff00; }
        #replayBtn { display: none; margin: 20px auto; padding: 15px 30px; background-color: #ed1c24; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="stats">Kredi: <span id="balance">0.00</span> Goud</div>

    <div class="video-wrapper">
        <div id="player"></div>
    </div>
    
    <button id="replayBtn" onclick="replayVideo()">REPLAY (Pou fè 50 santim ankò)</button>

    <script>
        let totalSantim = 0;
        const videoID = 'RoAtML-fDSI'; 

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoID,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                ajouteKredi();
                document.getElementById('replayBtn').style.display = 'block';
            }
        }

        function ajouteKredi() {
            totalSantim += 50; 
            let montanFinal = (totalSantim / 100).toFixed(2);
            document.getElementById("balance").innerText = montanFinal;

            // NOU VOYE REZILTA A BAY SKETCHWARE
            if (window.SketchwareInterface) {
                // Nou voye yon mesaj ki di se pou tou de bwat yo
                // Nou itilize fòma "test:montan" pou Sketchware ka separe l
                window.SketchwareInterface.voyeKòb("tout:" + montanFinal);
            }
        }

        function replayVideo() {
            player.playVideo();
            document.getElementById('replayBtn').style.display = 'none';
        }
    </script>
</body>
</html>
