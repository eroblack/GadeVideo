<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Video System</title>
    <style>
        body { background-color: #000; color: white; text-align: center; margin: 0; padding: 0; font-family: sans-serif; }
        .stats { padding: 15px; font-size: 22px; background: #1a1a1a; border-bottom: 3px solid #00ffff; font-weight: bold; color: #00ffff; }
        .video-wrapper { position: relative; padding-bottom: 177.77%; height: 0; overflow: hidden; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #replayBtn { display: none; margin: 20px auto; padding: 15px 30px; background: linear-gradient(45deg, #0088ff, #0033aa); color: white; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(0, 136, 255, 0.4); }
    </style>
</head>
<body>

    <div class="stats">Kredi: <span id="balance">0.00</span> HTG</div>

    <div class="video-wrapper">
        <div id="player"></div>
    </div>
    
    <button id="replayBtn" onclick="replayVideo()">REPLAY (Ganyen 1 santim)</button>

    <script>
        let totalGoud = 0;
        const videoID = 'RoAtML-fDSI'; 

        function sendToApp(bwat, val) {
            if (window.Android) { 
                window.Android.voyeKòb(bwat, val.toString()); 
            }
            if (window.SketchwareInterface) {
                window.SketchwareInterface.voyeKòb(bwat + ":" + val);
            }
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%', videoId: videoID,
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                // NOU AJOUTE 1 SANTIM (0.01)
                totalGoud += 0.01; 
                
                // Nou itilize toFixed(2) pou asire 0.01, 0.02, elatriye parèt byen
                let reziltaDisplay = totalGoud.toFixed(2);
                
                document.getElementById("balance").innerText = reziltaDisplay;
                document.getElementById('replayBtn').style.display = 'block';

                // SI KÒB LA RIVE NAN 1.00 (Sa vle di 100 videyo)
                // Nou voye 1 nan edittextGenyen sèlman
                if (totalGoud >= 1.00) {
                    sendToApp("genyen", "1");
                    
                    // Nou ka reset totalGoud la si nou vle moun nan rekòmanse nan 0
                    // totalGoud = 0; 
                }
            }
        }

        function replayVideo() {
            player.playVideo();
            document.getElementById('replayBtn').style.display = 'none';
        }
    </script>
</body>
</html>
