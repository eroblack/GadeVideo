<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistèm Gayan Eroblack</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #000; color: #fff; }
        .btn-boost { padding: 15px 30px; background: red; color: white; border: none; border-radius: 5px; font-size: 18px; }
    </style>
</head>
<body>

    <h2>Sistèm Gid Videyo</h2>
    <div id="display">Goud: 0.00</div>

    <script>
        let totalSantim = 0;

        // Fonksyon sa a ap kouri chak fwa moun nan fini gade videyo a
        function ajoutePwenApreVideo() {
            // Nou ajoute santim yo (egzanp: 25 santim chak fwa)
            totalSantim += 25; 

            // Kalkile goud ak rès santim
            let goud = Math.floor(totalSantim / 100);
            let rèsSantim = totalSantim % 100;
            
            // Fòmate montan an (ex: 1.25)
            let montanFinal = goud + (rèsSantim / 100);
            let reziltaFòmate = montanFinal.toFixed(2);

            // Montre l nan paj la
            document.getElementById("display").innerText = "Goud: " + reziltaFòmate;

            // VOYE REZILTA A NAN SKETCHWARE
            // Li pral frape edittextGenyen ou an jan ou te mande a
            if (window.SketchwareInterface) {
                SketchwareInterface.voyeKòb(reziltaFòmate);
            }
        }

        // Similasyon: Deklanche fonksyon an lè videyo a fini
        // Nan pwojè w la, mete "ajoutePwenApreVideo()" nan event 'ended' videyo a
    </script>

</body>
</html>
