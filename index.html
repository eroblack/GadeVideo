<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Game System</title>
    <style>
        body { background-color: #000; color: #fff; text-align: center; font-family: Arial; }
        .score-box { font-size: 24px; margin-top: 20px; color: #00ff00; }
        #video-container { width: 100%; max-width: 500px; margin: auto; }
    </style>
</head>
<body>

    <div class="score-box">Goud Ganyen: <span id="displayGoud">0.00</span></div>

    <script>
        // Nou itilize yon sèl varyab pou tout santim yo
        let totalSantim = 0;

        // Fonksyon sa a ap kouri chak fwa yon aksyon fini (ex: videyo fini)
        function kalkileEpiVoye(kantiteSantim) {
            // 1. Nou ajoute santim yo
            totalSantim += kantiteSantim;

            // 2. Nou konvèti yo an fòma 0.00 (Sa jere 100 santim = 1 goud la otomatikman)
            let reziltaFinal = (totalSantim / 100).toFixed(2);

            // 3. Montre l sou ekran HTML la
            document.getElementById("displayGoud").innerText = reziltaFinal;

            // 4. FRAPE SKETCHWARE: Voye valè a nan edittextGenyen
            if (window.SketchwareInterface) {
                // Nou voye montan an bay Sketchware
                SketchwareInterface.voyeKòb(reziltaFinal);
            }
        }

        // EGZANP: Si w vle ajoute 50 santim chak fwa yon videyo fini
        // kalkileEpiVoye(50); 
    </script>
</body>
</html>
