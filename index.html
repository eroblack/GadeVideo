<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Video Lajan</title>
    <style>
        body { 
            background: radial-gradient(circle, #021128, #000511); 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Nivo Lajan (Kwen Anwo Gòch) */
        .game-stats {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid #00ff00;
            padding: 8px 15px;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            font-size: 16px;
            font-weight: bold;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .game-stats span {
            display: block;
            font-size: 22px;
            text-shadow: 0 0 10px #00ff00;
        }

        /* Ti Ba Enfòmasyon */
        .game-ticker {
            position: absolute;
            bottom: 80px; 
            left: 5%;
            width: 90%; 
            background: rgba(2, 22, 53, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 20px; 
            padding: 5px 0; 
            z-index: 100;
            font-size: 11px; 
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 25s linear infinite; 
        }

        /* Videyo */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="game-stats">
        KREDI / WALLET
        <span id="balance">0.00</span> HTG
    </div>

    <div class="game-ticker">
        <div class="ticker-text">• Konte sou EROBLACK pou pi bon eksperyans! • Gade videyo a nèt pou w ka genyen kach! • Pou sipò oswa kesyon, imel nou nan: eroblack24@gmail.com • REPLAY ap ba w plis avantaj •</div>
    </div>

    <div class="video-wrapper">
        <div id="player"></div>
    </div>

    <script>
        const videoID = 'mtsXI56tQmk'; 

        function sendToApp(bwat, val) {
            if (window.Android) { window.Android.voyeKòb(bwat, val.toString()); }
            if (window.SketchwareInterface) { window.SketchwareInterface.voyeKòb(bwat + ":" + val); }
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%', videoId: videoID,
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                // 1. Montre 0.01 sou ekran HTML la pou yo wè yo genyen
                document.getElementById("balance").innerText = "0.01";

                // 2. Voye "0.01" bay Sketchware nan bwat "genyen" pou edittextGenyen ou an ka resevwa l
                sendToApp("genyen", "0.01");
                
                // 3. Apre 1 segonn (1000ms), remete kontè HTML la a 0.00 pou pwochen replay la
                setTimeout(function() {
                    document.getElementById("balance").innerText = "0.00";
                }, 1000);
            }
        }
    </script>
</body>
</html>
